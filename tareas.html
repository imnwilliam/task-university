<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas - Task University</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
    <nav class="bg-indigo-600 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="text-white font-bold text-xl flex items-center gap-2">
                    Task University
                </div>
                <div class="hidden md:flex space-x-6 text-white font-medium">
                    <a href="usuarios.html" class="hover:text-indigo-200 transition">Usuarios</a>
                    <a href="tareas.html" class="text-indigo-200">Tareas</a>
                    <a href="index-principal.html" class="hover:text-indigo-200 transition">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-md p-6 border-t-4 border-green-500">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">✅ Gestión de Tareas</h2>
            <form id="form-tareas" class="flex gap-4 mb-6">
                <input type="text" id="titulo-tarea" class="flex-1 rounded-md border-gray-300 shadow-sm border p-2" placeholder="¿Qué necesitas hacer?">
                <button type="submit" class="bg-green-500 text-white px-6 py-2 rounded-md hover:bg-green-600 font-medium">Agregar</button>
            </form>
            <div id="contenedor-tareas" class="space-y-3">
                <!-- Tareas inyectadas vía JS -->
            </div>
        </section>
    </main>

    <script src="tareas.js"></script>
</body>
</html>
